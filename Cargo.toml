[package]
name = "tapir-rs"
version = "0.1.0"
edition = "2021"
authors = ["TAPIR-RS Contributors"]
description = "Rust implementation of TAPIR - Transaction Application Protocol for Inconsistent Replication"
license = "MIT"
repository = "https://github.com/iyzhang/tapir-rs"
keywords = ["distributed-systems", "transactions", "replication", "consensus"]
categories = ["network-programming", "database"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
# Networking
bytes = "1.7"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Error handling
thiserror = "2.0"
anyhow = "1.0"
# Time utilities
chrono = "0.4"

[dev-dependencies]
# Testing
tokio-test = "0.4"
criterion = "0.5"
